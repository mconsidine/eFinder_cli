name: tiny_img Build eFinder RPi Image v2
on:
  push:
    branches: [ tiny_img ]
  workflow_dispatch:
    inputs:
      pi_os_date:
        description: 'Pi OS release date (YYYY-MM-DD)'
        required: true
        default: '2025-11-24'
      wifi_password:
        description: 'WiFi AP password'
        required: true
        default: '12345678'

#on:
#  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v6

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install required tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y parted e2fsprogs

      - name: Download official Raspberry Pi OS Lite
        run: |
          wget -q \
            https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          xz -d 2025-11-24-raspios-bookworm-arm64-lite.img.xz

      - name: Write config.env
        run: |
          printf 'WIFI_PASS="12345678"\nSAMBA_PASS="12345678"\n' > config.env

      - name: Write firstrun.sh and firstrun.service
        run: |
          echo  | base64 -d > firstrun.sh
          chmod +x firstrun.sh
          echo  | base64 -d > firstrun.service

      - name: Mount and customize image
        run: |
          IMAGE=2025-11-24-raspios-bookworm-arm64-lite.img

          truncate -s +256M $IMAGE

          LOOP=$(sudo losetup -fP --show $IMAGE)
          echo "Loop device: $LOOP"

          sudo parted -s $LOOP resizepart 2 100%
          sudo e2fsck -fy ${LOOP}p2 || true
          sudo resize2fs ${LOOP}p2

          sudo mkdir -p /mnt/pi/boot/firmware
          sudo mount ${LOOP}p2 /mnt/pi
          sudo mount ${LOOP}p1 /mnt/pi/boot/firmware

          sudo mkdir -p /mnt/pi/home/efinder/Solver

          sudo install -m 755 install.sh \
              /mnt/pi/home/efinder/install.sh
          sudo install -m 755 Solver/eFinder.py \
              /mnt/pi/home/efinder/Solver/eFinder.py
          sudo install -m 644 Solver/starnames.csv \
              /mnt/pi/home/efinder/Solver/starnames.csv
          sudo install -m 644 Solver/text.ttf \
              /mnt/pi/home/efinder/Solver/text.ttf
          sudo install -m 644 Solver/test.npy \
              /mnt/pi/home/efinder/Solver/test.npy
          sudo install -m 644 Solver/eFinder.config \
              /mnt/pi/home/efinder/Solver/eFinder.config

          sudo install -m 600 config.env \
              /mnt/pi/home/efinder/config.env

          sudo install -m 755 firstrun.sh \
              /mnt/pi/usr/local/bin/firstrun.sh
          sudo install -m 644 firstrun.service \
              /mnt/pi/etc/systemd/system/firstrun.service

          sudo touch /mnt/pi/boot/firmware/ssh

          sudo mkdir -p \
              /mnt/pi/etc/systemd/system/multi-user.target.wants
          sudo ln -sf \
              /etc/systemd/system/firstrun.service \
              /mnt/pi/etc/systemd/system/multi-user.target.wants/firstrun.service

          sudo touch /mnt/pi/home/efinder/.run_firstrun

          sudo umount /mnt/pi/boot/firmware
          sudo umount /mnt/pi
          sudo losetup -d $LOOP

          echo "Image customization complete"

      - name: Compress final image
        run: |
          xz -T0 -z 2025-11-24-raspios-bookworm-arm64-lite.img
          echo "Compression complete"

      - name: Generate artifact name
        run: |
          echo "ARTIFACT_NAME=efinder_zero_$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Upload image artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        run: |
          echo "=== Loop devices ==="
          sudo losetup -l
          echo "=== Mounted filesystems ==="
          mount | grep pi || true
          echo "=== Disk space ==="
          df -h
