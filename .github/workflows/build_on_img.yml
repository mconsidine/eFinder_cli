name: tiny_img Build eFinder RPi Image

on:
  push:
    branches: [ tiny_img ]
  workflow_dispatch:
    inputs:
      wifi_password:
        description: 'WiFi AP password'
        required: true
        default: '12345678'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install required tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y parted e2fsprogs whois

      - name: Download official Raspberry Pi OS Lite
        run: |
          wget -q \
            https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          xz -d 2025-11-24-raspios-bookworm-arm64-lite.img.xz

      - name: Mount and customize image
        run: |
          IMAGE=2025-11-24-raspios-bookworm-arm64-lite.img

          truncate -s +256M $IMAGE

          LOOP=$(sudo losetup -fP --show $IMAGE)
          echo "Loop device: $LOOP"

          sudo parted -s $LOOP resizepart 2 100%
          sudo e2fsck -fy ${LOOP}p2 || true
          sudo resize2fs ${LOOP}p2

          sudo mkdir -p /mnt/pi/boot/firmware
          sudo mount ${LOOP}p2 /mnt/pi
          sudo mount ${LOOP}p1 /mnt/pi/boot/firmware

          # ------------------------------------------------------------------
          # Create efinder user by writing directly to the user database files.
          # No chroot execution — avoids Exec format error on x86_64 runner.
          # ------------------------------------------------------------------
          HASHED=$(mkpasswd -m sha-512 "12345678")

          # Remove any existing UID 1000 user to avoid conflicts
          sudo sed -i '/^[^:]*:[^:]*:1000:[^:]*:/d' /mnt/pi/etc/passwd  || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/shadow  || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/group   || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/gshadow || true

          EF_UID=1000
          EF_GID=1000

          echo "efinder:x:${EF_UID}:${EF_GID}::/home/efinder:/bin/bash" | \
              sudo tee -a /mnt/pi/etc/passwd > /dev/null
          echo "efinder:${HASHED}:19000:0:99999:7:::" | \
              sudo tee -a /mnt/pi/etc/shadow > /dev/null
          echo "efinder:x:${EF_GID}:" | \
              sudo tee -a /mnt/pi/etc/group > /dev/null
          echo "efinder:!:::" | \
              sudo tee -a /mnt/pi/etc/gshadow > /dev/null

          # Add efinder to supplementary groups
          for GRP in sudo video gpio i2c spi dialout; do
              if grep -q "^${GRP}:" /mnt/pi/etc/group; then
                  LINE=$(grep "^${GRP}:" /mnt/pi/etc/group)
                  if echo "$LINE" | grep -q ":$"; then
                      sudo sed -i "s|^${GRP}:.*|${LINE}efinder|" /mnt/pi/etc/group
                  else
                      sudo sed -i "s|^${GRP}:.*|${LINE},efinder|" /mnt/pi/etc/group
                  fi
              fi
          done

          sudo mkdir -p /mnt/pi/home/efinder
          echo "  efinder user created (UID=$EF_UID)"

          # ------------------------------------------------------------------
          # Set hostname to efinder
          # ------------------------------------------------------------------
          echo "efinder" | sudo tee /mnt/pi/etc/hostname > /dev/null
          sudo sed -i 's/raspberrypi/efinder/g' /mnt/pi/etc/hosts
          echo "  hostname set to efinder"

          # ------------------------------------------------------------------
          # Enable SSH with password authentication
          # ------------------------------------------------------------------
          sudo touch /mnt/pi/boot/firmware/ssh
          sudo sed -i \
              's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' \
              /mnt/pi/etc/ssh/sshd_config
          echo "  SSH enabled"

          # ------------------------------------------------------------------
          # Boot firmware — camera overlay and USB serial gadget
          # Baked in at build time so tether works on very first boot,
          # before install.sh has run.
          # ------------------------------------------------------------------
          BOOT_CONFIG=/mnt/pi/boot/firmware/config.txt

          # Disable VC4 KMS (conflicts with camera)
          sudo sed -i -e '/^\s*dtoverlay=vc4-kms-v3d/s/^/#/' \
                      -e '/^\s*max_framebuffers=/s/^/#/' \
                      "$BOOT_CONFIG"

          echo ""                                           | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "# --- eFinder additions ---"               | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "# IMX477 camera"                           | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "camera_auto_detect=0"                      | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "dtoverlay=imx477"                          | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo ""                                          | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "# USB serial gadget (/dev/ttyUSB0 on host, /dev/ttyGS0 on Pi)" | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "dtoverlay=dwc2,dr_mode=peripheral"         | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "enable_uart=1"                             | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "  config.txt updated"

          CMDLINE=/mnt/pi/boot/firmware/cmdline.txt
          sudo sed -i 's/rootwait/rootwait modules-load=dwc2,g_serial/' "$CMDLINE"
          echo "  cmdline.txt updated"

          # ------------------------------------------------------------------
          # Enable serial getty on ttyGS0 so screen gets a login prompt.
          # Written with echo lines — no heredoc.
          # ------------------------------------------------------------------
          sudo mkdir -p /mnt/pi/etc/systemd/system/serial-getty@ttyGS0.service.d
          GETTY_OVERRIDE=/mnt/pi/etc/systemd/system/serial-getty@ttyGS0.service.d/override.conf
          echo "[Service]"                                     | sudo tee    "$GETTY_OVERRIDE" > /dev/null
          echo "ExecStart="                                    | sudo tee -a "$GETTY_OVERRIDE" > /dev/null
          echo "ExecStart=-/sbin/agetty -L -i 115200 ttyGS0" | sudo tee -a "$GETTY_OVERRIDE" > /dev/null

          sudo mkdir -p /mnt/pi/etc/systemd/system/multi-user.target.wants
          sudo ln -sf \
              /lib/systemd/system/serial-getty@.service \
              /mnt/pi/etc/systemd/system/multi-user.target.wants/serial-getty@ttyGS0.service
          echo "  serial-getty@ttyGS0 enabled"

          # ------------------------------------------------------------------
          # Stage application files
          # ------------------------------------------------------------------
          sudo mkdir -p /mnt/pi/home/efinder/Solver
          sudo mkdir -p /mnt/pi/home/efinder/uploads

          sudo install -m 755 Solver/eFinder.py \
              /mnt/pi/home/efinder/Solver/eFinder.py
          sudo install -m 644 Solver/starnames.csv \
              /mnt/pi/home/efinder/Solver/starnames.csv
          sudo install -m 644 Solver/text.ttf \
              /mnt/pi/home/efinder/Solver/text.ttf
          sudo install -m 644 Solver/test.npy \
              /mnt/pi/home/efinder/Solver/test.npy
          sudo install -m 644 Solver/eFinder.config \
              /mnt/pi/home/efinder/Solver/eFinder.config

          sudo install -m 755 install.sh \
              /mnt/pi/home/efinder/install.sh
          sudo install -m 755 station.sh \
              /mnt/pi/home/efinder/station.sh

          # ------------------------------------------------------------------
          # Fix ownership
          # ------------------------------------------------------------------
          sudo chown -R "${EF_UID}:${EF_GID}" /mnt/pi/home/efinder

          sudo umount /mnt/pi/boot/firmware
          sudo umount /mnt/pi
          sudo losetup -d $LOOP

          echo "Image customization complete"

      - name: Compress final image
        run: |
          xz -T0 -z 2025-11-24-raspios-bookworm-arm64-lite.img
          echo "Compression complete"

      - name: Generate artifact name
        run: |
          echo "ARTIFACT_NAME=efinder_zero_$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        run: |
          echo "=== Loop devices ==="
          sudo losetup -l
          echo "=== Mounted filesystems ==="
          mount | grep pi || true
          echo "=== Disk space ==="
          df -h
