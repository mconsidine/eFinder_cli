name: Build eFinder RPi Image v2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install required tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y parted e2fsprogs

      - name: Download official Raspberry Pi OS Lite
        run: |
          wget -q \
            https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          xz -d 2025-11-24-raspios-bookworm-arm64-lite.img.xz

      - name: Write config.env
        run: |
          cat > config.env <<'EOF'
          WIFI_PASS="12345678"
          SAMBA_PASS="12345678"
          EOF

      - name: Write firstrun.sh
        run: |
          cat > firstrun.sh <<'FSH'
          #!/bin/bash
          set -e
          LOG=/home/efinder/firstrun.log
          exec > >(tee -a "$LOG") 2>&1

          echo "=== eFinder first-boot setup: $(date) ==="

          # Fix ownership now that efinder user exists
          chown -R efinder:efinder /home/efinder

          # Load baked-in credentials
          source /home/efinder/config.env
          export WIFI_PASS SAMBA_PASS

          # Clone repo to get latest install.sh and app files
          cd /home/efinder
          git clone https://github.com/mconsidine/eFinder_cli.git efinder-repo

          # Run installer non-interactively
          bash /home/efinder/efinder-repo/install.sh --non-interactive

          # Remove trigger file — skips on all subsequent boots
          # To re-run manually: touch /home/efinder/.run_firstrun && sudo reboot
          rm -f /home/efinder/.run_firstrun

          echo "=== eFinder first-boot setup complete: $(date) ==="
          reboot
          FSH
          chmod +x firstrun.sh

      - name: Write firstrun.service
        run: |
          cat > firstrun.service <<'SVC'
          [Unit]
          Description=eFinder first-boot setup
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/home/efinder/.run_firstrun

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/firstrun.sh
          RemainAfterExit=yes
          StandardOutput=journal+console
          StandardError=journal+console
          TimeoutStartSec=1800

          [Install]
          WantedBy=multi-user.target
          SVC

      - name: Mount and customize image
        run: |
          IMAGE=2025-11-24-raspios-bookworm-arm64-lite.img

          # Extend image by 256MB to make room for our files
          truncate -s +256M $IMAGE

          # Set up loop device
          LOOP=$(sudo losetup -fP --show $IMAGE)
          echo "Loop device: $LOOP"

          # Resize root partition and filesystem to fill new space
          sudo parted -s $LOOP resizepart 2 100%
          sudo e2fsck -fy ${LOOP}p2 || true
          sudo resize2fs ${LOOP}p2

          # Mount root and boot partitions
          sudo mkdir -p /mnt/pi/boot/firmware
          sudo mount ${LOOP}p2 /mnt/pi
          sudo mount ${LOOP}p1 /mnt/pi/boot/firmware

          # Create efinder directory structure
          sudo mkdir -p /mnt/pi/home/efinder/Solver

          # Copy app files into image
          sudo install -m 755 install.sh \
              /mnt/pi/home/efinder/install.sh
          sudo install -m 755 Solver/eFinder.py \
              /mnt/pi/home/efinder/Solver/eFinder.py
          sudo install -m 644 Solver/starnames.csv \
              /mnt/pi/home/efinder/Solver/starnames.csv
          sudo install -m 644 Solver/text.ttf \
              /mnt/pi/home/efinder/Solver/text.ttf
          sudo install -m 644 Solver/test.npy \
              /mnt/pi/home/efinder/Solver/test.npy
          sudo install -m 644 Solver/eFinder.config \
              /mnt/pi/home/efinder/Solver/eFinder.config

          # Copy credentials — mode 600 so only efinder can read it
          sudo install -m 600 config.env \
              /mnt/pi/home/efinder/config.env

          # Install firstrun script and service
          sudo install -m 755 firstrun.sh \
              /mnt/pi/usr/local/bin/firstrun.sh
          sudo install -m 644 firstrun.service \
              /mnt/pi/etc/systemd/system/firstrun.service

          # Enable SSH by creating the flag file on the boot partition
          sudo touch /mnt/pi/boot/firmware/ssh

          # Enable firstrun.service via symlink — no systemctl needed
          sudo mkdir -p \
              /mnt/pi/etc/systemd/system/multi-user.target.wants
          sudo ln -sf \
              /etc/systemd/system/firstrun.service \
              /mnt/pi/etc/systemd/system/multi-user.target.wants/firstrun.service

          # Create the trigger file that firstrun.service checks for
          sudo touch /mnt/pi/home/efinder/.run_firstrun

          # Unmount cleanly
          sudo umount /mnt/pi/boot/firmware
          sudo umount /mnt/pi
          sudo losetup -d $LOOP

          echo "Image customization complete"

      - name: Compress final image
        run: |
          xz -T0 -z 2025-11-24-raspios-bookworm-arm64-lite.img
          echo "Compression complete"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: efinder-image-${{ github.sha }}
          path: 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        run: |
          echo "=== Loop devices ==="
          sudo losetup -l
          echo "=== Mounted filesystems ==="
          mount | grep pi || true
          echo "=== Disk space ==="
          df -h
