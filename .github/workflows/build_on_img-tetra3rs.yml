name: tetra3rs Build eFinder RPi Image

on:
  push:
    branches: [ tetra3rs ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install host tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y parted e2fsprogs whois

      # -----------------------------------------------------------------------
      # tetra3rs: cross-compile for aarch64 on the x86_64 runner.
      # Pre-built ARM64 wheels exist on PyPI but building from source with
      # Cortex-A53 + NEON flags gives better runtime performance.
      # The compiled wheel is staged in the image so install.sh uses it
      # instead of falling back to PyPI.
      # -----------------------------------------------------------------------
      - name: Install Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source "$HOME/.cargo/env"
          rustup target add aarch64-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get install -y \
            gcc-aarch64-linux-gnu \
            python3-pip \
            python3-dev \
            maturin \
            || true
          # maturin builds Python extension modules from Rust (pyo3)
          pip3 install maturin

      - name: Clone tetra3rs
        run: |
          git clone --depth 1 https://github.com/mconsidine/tetra3rs.git

      - name: Cache tetra3rs build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            tetra3rs/target
          key: tetra3rs-aarch64-${{ hashFiles('tetra3rs/Cargo.toml') }}
          restore-keys: tetra3rs-aarch64-

      - name: Cross-compile tetra3rs wheel for aarch64
        run: |
          source "$HOME/.cargo/env"
          cd tetra3rs/python
          export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc
          export CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc
          export CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++
          export AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar
          export RUSTFLAGS="-C target-cpu=cortex-a53 -C target-feature=+neon"
          # Build a manylinux-compatible wheel for aarch64
          maturin build --release \
              --target aarch64-unknown-linux-gnu \
              --out /tmp/tetra3rs-wheels/
          ls -lh /tmp/tetra3rs-wheels/

      - name: Download official Raspberry Pi OS Lite
        run: |
          wget -q \
            https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          xz -d 2025-11-24-raspios-bookworm-arm64-lite.img.xz

      - name: Mount and customize image
        run: |
          # Verify tetra3rs wheel was built
          echo "=== Pre-mount artifact check ==="
          ls -lh /tmp/tetra3rs-wheels/
          echo "=== Starting image customization ==="

          IMAGE=2025-11-24-raspios-bookworm-arm64-lite.img

          truncate -s +512M $IMAGE

          LOOP=$(sudo losetup -fP --show $IMAGE)
          echo "Loop device: $LOOP"

          sudo parted -s $LOOP resizepart 2 100%
          sudo e2fsck -fy ${LOOP}p2 || true
          sudo resize2fs ${LOOP}p2

          sudo mkdir -p /mnt/pi/boot/firmware
          sudo mount ${LOOP}p2 /mnt/pi
          sudo mount ${LOOP}p1 /mnt/pi/boot/firmware

          # ------------------------------------------------------------------
          # Create efinder user
          # ------------------------------------------------------------------
          HASHED=$(mkpasswd -m sha-512 "12345678")
          sudo sed -i '/^[^:]*:[^:]*:1000:[^:]*:/d' /mnt/pi/etc/passwd  || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/shadow  || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/group   || true
          sudo sed -i '/^[^:]*:[^:]*:1000:/d'        /mnt/pi/etc/gshadow || true

          EF_UID=1000; EF_GID=1000
          echo "efinder:x:${EF_UID}:${EF_GID}::/home/efinder:/bin/bash" | \
              sudo tee -a /mnt/pi/etc/passwd > /dev/null
          echo "efinder:${HASHED}:19000:0:99999:7:::" | \
              sudo tee -a /mnt/pi/etc/shadow > /dev/null
          echo "efinder:x:${EF_GID}:" | \
              sudo tee -a /mnt/pi/etc/group > /dev/null
          echo "efinder:!:::" | \
              sudo tee -a /mnt/pi/etc/gshadow > /dev/null
          for GRP in sudo video gpio i2c spi dialout; do
              if grep -q "^${GRP}:" /mnt/pi/etc/group; then
                  LINE=$(grep "^${GRP}:" /mnt/pi/etc/group)
                  if echo "$LINE" | grep -q ":$"; then
                      sudo sed -i "s|^${GRP}:.*|${LINE}efinder|" /mnt/pi/etc/group
                  else
                      sudo sed -i "s|^${GRP}:.*|${LINE},efinder|" /mnt/pi/etc/group
                  fi
              fi
          done
          sudo mkdir -p /mnt/pi/home/efinder
          echo "  efinder user created (UID=$EF_UID)"

          # ------------------------------------------------------------------
          # Hostname
          # ------------------------------------------------------------------
          echo "efinder" | sudo tee /mnt/pi/etc/hostname > /dev/null
          sudo sed -i 's/raspberrypi/efinder/g' /mnt/pi/etc/hosts

          # ------------------------------------------------------------------
          # SSH
          # ------------------------------------------------------------------
          sudo touch /mnt/pi/boot/firmware/ssh
          sudo sed -i \
              's/^#*PasswordAuthentication.*/PasswordAuthentication yes/' \
              /mnt/pi/etc/ssh/sshd_config

          # ------------------------------------------------------------------
          # Boot firmware — camera overlay + USB serial gadget (g_serial)
          # ------------------------------------------------------------------
          BOOT_CONFIG=/mnt/pi/boot/firmware/config.txt
          sudo sed -i -e '/^\s*dtoverlay=vc4-kms-v3d/s/^/#/' \
                      -e '/^\s*max_framebuffers=/s/^/#/' \
                      "$BOOT_CONFIG"
          echo ""                                                          | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "# --- eFinder additions ---"                               | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "camera_auto_detect=0"                                      | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "dtoverlay=imx477"                                          | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "dtoverlay=dwc2,dr_mode=peripheral"                         | sudo tee -a "$BOOT_CONFIG" > /dev/null
          echo "enable_uart=1"                                              | sudo tee -a "$BOOT_CONFIG" > /dev/null

          CMDLINE=/mnt/pi/boot/firmware/cmdline.txt
          sudo sed -i 's/rootwait/rootwait modules-load=dwc2,g_serial/' "$CMDLINE"

          # serial-getty on ttyGS0
          sudo mkdir -p /mnt/pi/etc/systemd/system/serial-getty@ttyGS0.service.d
          GETTY=/mnt/pi/etc/systemd/system/serial-getty@ttyGS0.service.d/override.conf
          echo "[Service]"                                     | sudo tee    "$GETTY" > /dev/null
          echo "ExecStart="                                    | sudo tee -a "$GETTY" > /dev/null
          echo "ExecStart=-/sbin/agetty -L -i 115200 ttyGS0" | sudo tee -a "$GETTY" > /dev/null
          sudo mkdir -p /mnt/pi/etc/systemd/system/multi-user.target.wants
          sudo ln -sf \
              /lib/systemd/system/serial-getty@.service \
              /mnt/pi/etc/systemd/system/multi-user.target.wants/serial-getty@ttyGS0.service

          # ------------------------------------------------------------------
          # WiFi country code
          # ------------------------------------------------------------------
          sudo mkdir -p /mnt/pi/etc/wpa_supplicant
          echo "country=US"                                              | sudo tee    /mnt/pi/etc/wpa_supplicant/wpa_supplicant.conf > /dev/null
          echo "ctrl_interface=DIR=/var/run/wpa_supplicant GROUP=netdev" | sudo tee -a /mnt/pi/etc/wpa_supplicant/wpa_supplicant.conf > /dev/null
          echo "update_config=1"                                         | sudo tee -a /mnt/pi/etc/wpa_supplicant/wpa_supplicant.conf > /dev/null
          echo "REGDOMAIN=US" | sudo tee /mnt/pi/etc/default/crda > /dev/null

          # ------------------------------------------------------------------
          # WiFi AP profile with placeholder SSID + firstboot SSID fixup
          # ------------------------------------------------------------------
          sudo mkdir -p /mnt/pi/etc/NetworkManager/system-connections
          NM=/mnt/pi/etc/NetworkManager/system-connections/efinder-ap.nmconnection
          echo "[connection]"                       | sudo tee    "$NM" > /dev/null
          echo "id=efinder-ap"                      | sudo tee -a "$NM" > /dev/null
          echo "type=wifi"                          | sudo tee -a "$NM" > /dev/null
          echo "interface-name=wlan0"               | sudo tee -a "$NM" > /dev/null
          echo "autoconnect=true"                   | sudo tee -a "$NM" > /dev/null
          echo "autoconnect-priority=100"           | sudo tee -a "$NM" > /dev/null
          echo ""                                   | sudo tee -a "$NM" > /dev/null
          echo "[wifi]"                             | sudo tee -a "$NM" > /dev/null
          echo "mode=ap"                            | sudo tee -a "$NM" > /dev/null
          echo "ssid=efinder0000"                   | sudo tee -a "$NM" > /dev/null
          echo "band=bg"                            | sudo tee -a "$NM" > /dev/null
          echo "channel=6"                          | sudo tee -a "$NM" > /dev/null
          echo ""                                   | sudo tee -a "$NM" > /dev/null
          echo "[wifi-security]"                    | sudo tee -a "$NM" > /dev/null
          echo "key-mgmt=wpa-psk"                   | sudo tee -a "$NM" > /dev/null
          echo "psk=12345678"                       | sudo tee -a "$NM" > /dev/null
          echo ""                                   | sudo tee -a "$NM" > /dev/null
          echo "[ipv4]"                             | sudo tee -a "$NM" > /dev/null
          echo "method=shared"                      | sudo tee -a "$NM" > /dev/null
          echo "address1=192.168.50.1/24"           | sudo tee -a "$NM" > /dev/null
          echo ""                                   | sudo tee -a "$NM" > /dev/null
          echo "[ipv6]"                             | sudo tee -a "$NM" > /dev/null
          echo "method=disabled"                    | sudo tee -a "$NM" > /dev/null
          sudo chmod 600 "$NM"
          sudo rm -f /mnt/pi/etc/NetworkManager/system-connections/preconfigured.nmconnection

          FBSCRIPT=/mnt/pi/usr/local/bin/efinder-firstboot.sh
          sudo mkdir -p /mnt/pi/usr/local/bin
          echo '#!/bin/bash'                                                        | sudo tee    "$FBSCRIPT" > /dev/null
          echo 'NM=/etc/NetworkManager/system-connections/efinder-ap.nmconnection' | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'MAC=$(cat /sys/class/net/wlan0/address 2>/dev/null || echo "")'    | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'if [ -n "$MAC" ]; then'                                            | sudo tee -a "$FBSCRIPT" > /dev/null
          echo '    LAST4=$(echo "$MAC" | tr -d ":" | tail -c 5)'                  | sudo tee -a "$FBSCRIPT" > /dev/null
          echo '    NEW_SSID="efinder${LAST4}"'                                    | sudo tee -a "$FBSCRIPT" > /dev/null
          echo '    sed -i "s/^ssid=.*/ssid=${NEW_SSID}/" "$NM"'                   | sudo tee -a "$FBSCRIPT" > /dev/null
          echo '    nmcli connection reload 2>/dev/null || true'                   | sudo tee -a "$FBSCRIPT" > /dev/null
          echo '    nmcli connection up efinder-ap 2>/dev/null || true'            | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'fi'                                                                 | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'systemctl disable efinder-firstboot.service'                       | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'rm -f /etc/systemd/system/efinder-firstboot.service'               | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'rm -f /usr/local/bin/efinder-firstboot.sh'                         | sudo tee -a "$FBSCRIPT" > /dev/null
          echo 'systemctl daemon-reload'                                            | sudo tee -a "$FBSCRIPT" > /dev/null
          sudo chmod 755 "$FBSCRIPT"

          FBSVC=/mnt/pi/etc/systemd/system/efinder-firstboot.service
          echo "[Unit]"                                                             | sudo tee    "$FBSVC" > /dev/null
          echo "Description=eFinder first-boot SSID configuration"                | sudo tee -a "$FBSVC" > /dev/null
          echo "After=NetworkManager.service"                                      | sudo tee -a "$FBSVC" > /dev/null
          echo "Wants=NetworkManager.service"                                      | sudo tee -a "$FBSVC" > /dev/null
          echo "ConditionPathExists=/usr/local/bin/efinder-firstboot.sh"           | sudo tee -a "$FBSVC" > /dev/null
          echo ""                                                                   | sudo tee -a "$FBSVC" > /dev/null
          echo "[Service]"                                                          | sudo tee -a "$FBSVC" > /dev/null
          echo "Type=oneshot"                                                       | sudo tee -a "$FBSVC" > /dev/null
          echo "ExecStart=/bin/bash /usr/local/bin/efinder-firstboot.sh"           | sudo tee -a "$FBSVC" > /dev/null
          echo "RemainAfterExit=yes"                                               | sudo tee -a "$FBSVC" > /dev/null
          echo ""                                                                   | sudo tee -a "$FBSVC" > /dev/null
          echo "[Install]"                                                          | sudo tee -a "$FBSVC" > /dev/null
          echo "WantedBy=multi-user.target"                                        | sudo tee -a "$FBSVC" > /dev/null
          sudo ln -sf \
              /etc/systemd/system/efinder-firstboot.service \
              /mnt/pi/etc/systemd/system/multi-user.target.wants/efinder-firstboot.service

          # ------------------------------------------------------------------
          # Stage application files
          # ------------------------------------------------------------------
          sudo mkdir -p /mnt/pi/home/efinder/Solver
          sudo mkdir -p /mnt/pi/home/efinder/uploads

          sudo install -m 755 Solver/eFinder-tetra3rs.py \
              /mnt/pi/home/efinder/Solver/eFinder-tetra3rs.py
          sudo install -m 644 Solver/starnames.csv \
              /mnt/pi/home/efinder/Solver/starnames.csv
          sudo install -m 644 Solver/text.ttf \
              /mnt/pi/home/efinder/Solver/text.ttf
          sudo install -m 644 Solver/test.npy \
              /mnt/pi/home/efinder/Solver/test.npy
          sudo install -m 644 Solver/eFinder.config \
              /mnt/pi/home/efinder/Solver/eFinder.config

          # Stage pre-built tetra3rs wheel so install.sh builds from it
          sudo mkdir -p /mnt/pi/home/efinder/tetra3rs-src
          sudo cp /tmp/tetra3rs-wheels/*.whl /mnt/pi/home/efinder/tetra3rs-src/
          echo "  tetra3rs wheel staged: $(ls /tmp/tetra3rs-wheels/*.whl)"

          sudo install -m 755 install-tetra3rs.sh \
              /mnt/pi/home/efinder/install.sh
          sudo install -m 755 station.sh \
              /mnt/pi/home/efinder/station.sh
          sudo install -m 755 sendcmd.sh \
              /mnt/pi/home/efinder/sendcmd.sh

          # ------------------------------------------------------------------
          # Fix ownership
          # ------------------------------------------------------------------
          sudo chown -R "${EF_UID}:${EF_GID}" /mnt/pi/home/efinder

          sudo umount /mnt/pi/boot/firmware
          sudo umount /mnt/pi
          sudo losetup -d $LOOP

          echo "Image customization complete"

      - name: Compress final image
        run: |
          xz -T0 -z 2025-11-24-raspios-bookworm-arm64-lite.img
          echo "Compression complete"

      - name: Generate artifact name
        run: |
          echo "ARTIFACT_NAME=efinder_tetra3rs_$(date +%Y%m%d)" >> $GITHUB_ENV

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          compression-level: 0
          if-no-files-found: error
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        run: |
          echo "=== Loop devices ==="
          sudo losetup -l
          echo "=== Mounted filesystems ==="
          mount | grep pi || true
          echo "=== Disk space ==="
          df -h
