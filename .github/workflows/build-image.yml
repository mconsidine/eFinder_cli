name: Build eFinder RPi Image

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Free up runner disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android \
                      /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Build stage-custom structure and write all files
        run: |

          # ---------------------------------------------------------------
          # Directory structure
          # ---------------------------------------------------------------
          mkdir -p stage-custom/00-install/files/Solver

          # ---------------------------------------------------------------
          # Stage root control files
          # ---------------------------------------------------------------
          touch stage-custom/EXPORT_IMAGE
          touch stage-custom/SKIP_IMAGES
          echo "stage2" > stage-custom/STAGE_PREREQS

          # ---------------------------------------------------------------
          # prerun.sh — at stage ROOT, copies stage2 rootfs before anything
          # else runs. This is what pi-gen requires to inherit the previous
          # stage filesystem.
          # ---------------------------------------------------------------
          cat > stage-custom/prerun.sh <<'PRERUN'
          #!/bin/bash -e
          if [ ! -d "${ROOTFS_DIR}" ]; then
            copy_previous
          fi
          PRERUN
          chmod +x stage-custom/prerun.sh

          # ---------------------------------------------------------------
          # 00-packages — only what is needed at image build time.
          # Everything else (pip, apt upgrade, etc.) runs at first boot
          # via install.sh.
          # ---------------------------------------------------------------
          cat > stage-custom/00-install/00-packages <<'PKGS'
          git
          PKGS

          # ---------------------------------------------------------------
          # firstrun.service — systemd unit baked into the image.
          # Runs on first boot when .run_firstrun trigger file is present.
          # ---------------------------------------------------------------
          cat > stage-custom/00-install/files/firstrun.service <<'SVC'
          [Unit]
          Description=eFinder first-boot setup
          After=network-online.target
          Wants=network-online.target
          ConditionPathExists=/home/efinder/.run_firstrun

          [Service]
          Type=oneshot
          ExecStart=/usr/local/bin/firstrun.sh
          RemainAfterExit=yes
          StandardOutput=journal+console
          StandardError=journal+console
          TimeoutStartSec=1800

          [Install]
          WantedBy=multi-user.target
          SVC

          # ---------------------------------------------------------------
          # firstrun.sh — runs on first boot.
          # Fixes ownership, clones repo, runs install.sh, then reboots.
          # To re-run: touch /home/efinder/.run_firstrun && sudo reboot
          # ---------------------------------------------------------------
          cat > stage-custom/00-install/files/firstrun.sh <<'FSH'
          #!/bin/bash
          set -e
          LOG=/home/efinder/firstrun.log
          exec > >(tee -a "$LOG") 2>&1

          echo "=== eFinder first-boot setup: $(date) ==="

          # Fix ownership now that the efinder user exists at runtime
          chown -R efinder:efinder /home/efinder

          # Load credentials baked into the image at build time
          source /home/efinder/config.env
          export WIFI_PASS SAMBA_PASS

          # Clone the repo to get the latest install.sh and app files
          cd /home/efinder
          git clone https://github.com/mconsidine/eFinder_cli.git efinder-repo

          # Run the installer non-interactively
          bash /home/efinder/efinder-repo/install.sh --non-interactive

          # Remove trigger file — service will skip on all subsequent boots
          # To re-run: touch /home/efinder/.run_firstrun && sudo reboot
          rm -f /home/efinder/.run_firstrun

          echo "=== eFinder first-boot setup complete: $(date) ==="
          reboot
          FSH
          chmod +x stage-custom/00-install/files/firstrun.sh

          # ---------------------------------------------------------------
          # config.env — credentials injected from GitHub secrets at build
          # time. Mode 600 so only efinder user can read it.
          # ---------------------------------------------------------------
          cat > stage-custom/00-install/files/config.env <<EOF
          WIFI_PASS="12345678"
          SAMBA_PASS="12345678"
          EOF

          # ---------------------------------------------------------------
          # Copy app files from repo into the stage
          # ---------------------------------------------------------------
          cp install.sh                  stage-custom/00-install/files/install.sh
          cp Solver/eFinder.py           stage-custom/00-install/files/Solver/eFinder.py
          cp Solver/starnames.csv        stage-custom/00-install/files/Solver/starnames.csv
          cp Solver/text.ttf             stage-custom/00-install/files/Solver/text.ttf
          cp Solver/test.npy             stage-custom/00-install/files/Solver/test.npy
          cp Solver/eFinder.config       stage-custom/00-install/files/Solver/eFinder.config

          # ---------------------------------------------------------------
          # 01-run.sh — runs inside the pi-gen chroot at BUILD time.
          # Rules:
          #   - Use ${ROOTFS_DIR} prefix for all file paths
          #   - NO systemctl, NO pip, NO apt, NO network calls
          #   - Service enabling done via symlink only
          #   - NO chown (efinder user does not exist yet at build time)
          # ---------------------------------------------------------------
          cat > stage-custom/00-install/01-run.sh <<'RUN'
          #!/bin/bash -e

          echo "=== eFinder 01-run.sh: starting ==="

          # Create directory structure inside the image
          install -d -m 755 "${ROOTFS_DIR}/home/efinder"
          install -d -m 755 "${ROOTFS_DIR}/home/efinder/Solver"

          # Copy app files into the image
          install -m 755 files/install.sh \
              "${ROOTFS_DIR}/home/efinder/install.sh"
          install -m 755 files/Solver/eFinder.py \
              "${ROOTFS_DIR}/home/efinder/Solver/eFinder.py"
          install -m 644 files/Solver/starnames.csv \
              "${ROOTFS_DIR}/home/efinder/Solver/starnames.csv"
          install -m 644 files/Solver/text.ttf \
              "${ROOTFS_DIR}/home/efinder/Solver/text.ttf"
          install -m 644 files/Solver/test.npy \
              "${ROOTFS_DIR}/home/efinder/Solver/test.npy"
          install -m 644 files/Solver/eFinder.config \
              "${ROOTFS_DIR}/home/efinder/Solver/eFinder.config"

          # Copy credentials — mode 600, efinder eyes only
          install -m 600 files/config.env \
              "${ROOTFS_DIR}/home/efinder/config.env"

          # Install firstrun script and service into the image
          install -m 755 files/firstrun.sh \
              "${ROOTFS_DIR}/usr/local/bin/firstrun.sh"
          install -m 644 files/firstrun.service \
              "${ROOTFS_DIR}/etc/systemd/system/firstrun.service"

          # Create the trigger file that tells firstrun.service to run
          touch "${ROOTFS_DIR}/home/efinder/.run_firstrun"

          # Enable firstrun.service via symlink — correct way in a chroot
          # systemctl enable cannot be used at build time
          mkdir -p \
              "${ROOTFS_DIR}/etc/systemd/system/multi-user.target.wants"
          ln -sf \
              /etc/systemd/system/firstrun.service \
              "${ROOTFS_DIR}/etc/systemd/system/multi-user.target.wants/firstrun.service"

          echo "=== eFinder 01-run.sh: complete ==="
          RUN
          chmod +x stage-custom/00-install/01-run.sh

      - name: Build Raspberry Pi OS image
        uses: usimd/pi-gen-action@v1
        id: build
        with:
          pi-gen-version: "2025-11-24-raspios-bookworm-arm64"
          extra-host-dependencies: git
          image-name: "efinder"
          release: bookworm
          stage-list: "stage0 stage1 stage2 ./stage-custom"
          compression: "xz"
          enable-ssh: 1
          username: "efinder"
          password: ${{ secrets.EFINDER_PI_PASSWORD }}
          hostname: "efinder"
          locale: "en_US.UTF-8"
          keyboard-keymap: "us"
          keyboard-layout: "English (US)"
          timezone: "America/New_York"
          wpa-country: "US"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: efinder-image-${{ github.sha }}
          path: ${{ steps.build.outputs.image-path }}
          retention-days: 14

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: /tmp/pi-gen-action*/work/*/build.log
          retention-days: 3
