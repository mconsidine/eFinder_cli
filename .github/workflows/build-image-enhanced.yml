name: v4 Build eFinder Enhanced OS Image

on:
  push:
    branches: [ enhanced ]
  workflow_dispatch:
    inputs:
      pi_os_date:
        description: 'Pi OS release date (YYYY-MM-DD)'
        required: true
        default: '2025-11-24'
      wifi_password:
        description: 'WiFi AP password'
        required: true
        default: '12345678'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: enhanced

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-user-static \
            binfmt-support \
            parted \
            util-linux \
            kpartx

      - name: Download Pi OS
        run: |
          wget https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          unxz 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          test -f 2025-11-24-raspios-bookworm-arm64-lite.img

      - name: Expand image file
        run: |
          truncate -s +6G 2025-11-24-raspios-bookworm-arm64-lite.img

      - name: Mount image
        run: |
          sudo losetup -Pf 2025-11-24-raspios-bookworm-arm64-lite.img
          LOOP=$(losetup -j 2025-11-24-raspios-bookworm-arm64-lite.img | cut -d: -f1)
          echo "LOOP=$LOOP" >> $GITHUB_ENV

          sudo parted $LOOP resizepart 2 100%
          sudo udevadm settle
          sudo e2fsck -fp ${LOOP}p2
          sudo resize2fs ${LOOP}p2

          sudo mkdir -p /mnt/rpi
          sudo mount ${LOOP}p2 /mnt/rpi

      - name: Copy install script into image
        run: |
          #sudo cp install-complete.sh /mnt/rpi/root/
          ls ..
          ls -la
          sudo cp -r *.sh /mnt/rpi/root/
          ls -la

      - name: Prepare chroot
        run: |
          sudo cp /usr/bin/qemu-aarch64-static /mnt/rpi/usr/bin/

          sudo mount --bind /dev /mnt/rpi/dev
          sudo mount --bind /proc /mnt/rpi/proc
          sudo mount --bind /sys /mnt/rpi/sys

      - name: Run installation inside image
        run: |
          sudo chroot /mnt/rpi /bin/bash -c "
            export USER_PASSWORD=12345678
            export WIFI_PASSWORD=${{ github.event.inputs.wifi_password || '12345678' }}
            export SAMBA_PASSWORD=12345678
            export NON_INTERACTIVE=1

            cd /root || cd /
            bash /root/install-complete.sh --non-interactive
          "

      - name: Cleanup mounts
        run: |
          sudo umount /mnt/rpi/dev || true
          sudo umount /mnt/rpi/proc || true
          sudo umount /mnt/rpi/sys || true
          sudo umount /mnt/rpi || true
          sudo losetup -D

      - name: Compress image
        run: |
          xz -6 -T0 2025-11-24-raspios-bookworm-arm64-lite.img

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: efinder-enhanced-2025-11-24
          path: 2025-11-24-raspios-bookworm-arm64-lite.img.xz
          retention-days: 30

      - name: Create installation instructions
        run: |
          cat > INSTALL.txt << 'INSTRUCTIONS'
          eFinder Enhanced Edition - Installation Instructions
          
          1. Download the .img.xz file from artifacts
          2. Flash to 16GB+ microSD card using:
             - Raspberry Pi Imager, or
             - Etcher, or
             - Command line: xzcat image.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          
          3. Insert SD card in Pi Zero 2W and power on
          4. Wait 60 seconds for boot
          5. Connect to WiFi: efinderXXXX (password: 12345678)
          6. Browse to: http://192.168.50.1/
          
          Default credentials:
          - SSH: efinder / 12345678
          - Samba: efinder / 12345678
          
          See README.md for full documentation.
          INSTRUCTIONS

      - name: Upload instructions
        uses: actions/upload-artifact@v4
        with:
          name: installation-instructions
          path: INSTALL.txt
