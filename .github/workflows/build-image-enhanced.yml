name: v4 Build eFinder Enhanced OS Image

on:
  push:
    branches: [ enhanced ]
  workflow_dispatch:
    inputs:
      pi_os_date:
        description: 'Pi OS release date (YYYY-MM-DD)'
        required: true
        default: '2025-11-24'
      wifi_password:
        description: 'WiFi AP password'
        required: true
        default: '12345678'

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: enhanced
      
      - name: Download Pi OS
        run: |
          #wget https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-${{ inputs.pi_os_date }}/${{ inputs.pi_os_date }}-raspios-bookworm-arm64-lite.img.xz
          wget https://downloads.raspberrypi.org/raspios_oldstable_lite_arm64/images/raspios_oldstable_lite_arm64-2025-11-24/2025-11-24-raspios-bookworm-arm64-lite.img.xz
          unxz ${{ inputs.pi_os_date }}-raspios-bookworm-arm64-lite.img.xz
      
      - name: Run installation in ARM environment
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: ${{ inputs.pi_os_date }}-raspios-bookworm-arm64-lite.img
          cpu: cortex-a53
          commands: |
            # Set environment variables
            export USER_PASSWORD=12345678
            export WIFI_PASSWORD=${{ inputs.wifi_password }}
            export SAMBA_PASSWORD=12345678
            export NON_INTERACTIVE=1
            
            # Run installation phases
            bash install-complete.sh
      
      - name: Compress image
        run: |
          xz -6 -T0 ${{ inputs.pi_os_date }}-raspios-bookworm-arm64-lite.img
      
      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: efinder-enhanced-${{ inputs.pi_os_date }}
          path: ${{ inputs.pi_os_date }}-raspios-bookworm-arm64-lite.img.xz
          retention-days: 30
      
      - name: Create installation instructions
        run: |
          cat > INSTALL.txt << 'INSTRUCTIONS'
          eFinder Enhanced Edition - Installation Instructions
          
          1. Download the .img.xz file from artifacts
          2. Flash to 16GB+ microSD card using:
             - Raspberry Pi Imager, or
             - Etcher, or
             - Command line: xzcat image.img.xz | sudo dd of=/dev/sdX bs=4M status=progress
          
          3. Insert SD card in Pi Zero 2W and power on
          4. Wait 60 seconds for boot
          5. Connect to WiFi: efinderXXXX (password: ${{ inputs.wifi_password }})
          6. Browse to: http://192.168.50.1/
          
          Default credentials:
          - SSH: efinder / 12345678
          - Samba: efinder / 12345678
          
          See README.md for full documentation.
          INSTRUCTIONS
      
      - name: Upload instructions
        uses: actions/upload-artifact@v4
        with:
          name: installation-instructions
          path: INSTALL.txt
